<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kepuasan Pelanggan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Dashboard Pelanggan</a>
        <div>
            <a href="/" class="btn btn-light btn-sm">Data</a>
            <a href="/visualisasi" class="btn btn-warning btn-sm">Visualisasi</a>
            <a href="/machine-learning" class="btn btn-success btn-sm">Machine Learning</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Menampilkan pesan flash dari Flask -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Konten halaman lain akan masuk ke sini -->
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
